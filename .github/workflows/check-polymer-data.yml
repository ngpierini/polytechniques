name: Check data integrity

# Runs on every PR/push that touches either reference dataset and fails if an
# entry is malformed.
#
# polymer-data.js: duplicate name/CAS/structure, a bond pointing at a
# nonexistent atom, a missing chain-end pseudo-atom, an obviously bad valence,
# or a monomer CAS number filed where the polymer's belongs.
#
# thermal-library.js: a dma.type or tga.special the renderers do not branch on,
# a TGA mass balance that does not close, or cross-field impossibilities like a
# heat of fusion with no melt. Both charts fail quietly on bad data, so this is
# the only thing standing between a typo and a wrong thermogram.

on:
  pull_request:
    paths:
      - 'polymer-data.js'
      - 'polymer-graph.js'
      - 'thermal-library.js'
      - 'chain-data.js'
      - 'thermal-analysis.html'
      - 'search-index.json'
      - 'scripts/**'
      - 'app.js'
      - 'nav.js'
  push:
    branches:
      - main
    paths:
      - 'polymer-data.js'
      - 'polymer-graph.js'
      - 'thermal-library.js'
      - 'chain-data.js'
      - 'thermal-analysis.html'
      - 'search-index.json'
      - 'scripts/**'
      - 'app.js'
      - 'nav.js'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: node scripts/check-polymer-data.js

      - run: node scripts/check-thermal-library.js

      - run: node scripts/check-chain-data.js

      - name: Cross-reference between the polymer, thermal and chain datasets is current
        run: node scripts/build-xref.js --check

      # monomer-data.js is a projection of polymer-data.js, so it goes stale the
      # moment a polymer is added, edited or reclassified. Stale here means a
      # monomer whose structure no longer matches the polymer it claims to make.
      - name: Monomer library is current with the polymer library
        run: node scripts/build-monomer-library.js --check

      # The family reference pages are a projection of polymer-data.js, so they
      # go stale the moment an entry is added or reclassified - and a stale one
      # is a page publishing a CAS number or a note that the library has since
      # corrected. This also re-checks every Tg the hand-written prose quotes
      # against the entry it names.
      - name: Family pages are current with the polymer library
        run: node scripts/build-family-pages.js --check

      # The repo had thorough checks on the DATA and none on the arithmetic the
      # calculators publish. Every case is a number printed on a page as a
      # worked example, so a failure means the site is telling a visitor
      # something the code no longer does.
      - name: Calculator worked examples still match the maths
        run: node scripts/check-calculator-math.js

      # The structure map is a projection of polymer-data.js, so it goes stale
      # when an entry is added or its structure edited. Deterministic by
      # construction - t-SNE seeded from PCA, no RNG - so this can be checked
      # rather than merely rebuilt.
      - name: Structure map is current with the polymer library
        run: node scripts/build-structure-map.js --check

      # Fails if an indexable page is missing from sitemap.xml, which is
      # hand-maintained and had silently dropped one of the main tools.
      - run: node scripts/check-sitemap.js

      # Fails if the AdSense publisher number stops matching between ads.txt,
      # nav.js and the page heads - a mismatch stops serving without any
      # visible error on the site itself.
      - run: node scripts/check-adsense.js

      # Backstop for the pre-commit hook, which lives only in a local clone.
      - run: node scripts/check-no-energetic.js

      # Fails if search-index.json wasn't regenerated after a data change.
      - run: npm run check-index
